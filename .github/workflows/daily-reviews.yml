name: Daily Player Reviews

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2:00 AM UTC daily
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Fetch and rewrite reviews
        run: python scripts/fetch_reviews.py

      - name: Commit updated reviews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/balatro/player_reviews.yaml
          if git diff --staged --quiet; then
            echo "No new reviews to commit."
          else
            git commit -m "chore: auto-update player reviews $(date -u +%Y-%m-%d)"
            git push
          fi
