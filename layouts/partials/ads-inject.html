{{ if .Site.Params.adsenseClient }}
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="{{ .Site.Params.adsenseClient }}"
     data-ad-slot="auto"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
{{ else }}
<div class="ad-slot">[ AdSense Slot — replace with your ad code ]</div>
{{ end }}
