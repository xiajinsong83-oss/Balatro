{{ $faqData := .Site.Data.balatro.player_faq }}
{{ if $faqData }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{ range $i, $item := $faqData }}
    {
      "@type": "Question",
      "name": {{ $item.question | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ printf "%s %s" $item.summary $item.workaround | jsonify }}
      }
    }{{ if ne $i (sub (len $faqData) 1) }},{{ end }}
    {{ end }}
  ]
}
</script>
{{ end }}

<div class="faq-container">
  {{ range $faqData }}
  <div class="faq-item">
    <h3 class="faq-question">{{ .question }}</h3>
    <div class="faq-answer">
      <p>{{ .summary }}</p>
      {{ if .workaround }}<p><strong>Workaround:</strong> {{ .workaround }}</p>{{ end }}
      <p class="faq-note"><em>{{ .source_note }} | Updated: {{ .updated_at }}</em></p>
    </div>
  </div>
  {{ end }}
</div>
