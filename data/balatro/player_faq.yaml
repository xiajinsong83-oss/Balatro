- question: How do I unlock new decks in Balatro?
  summary: Decks are unlocked by defeating each Ante's boss Blind on increasing stake
    levels. Start with the Red Deck. Beat Ante 8 on White Stake to unlock the Blue
    Deck. There are 15 total decks to unlock.
  workaround: ''
  source_note: Aggregated from community knowledge base
  updated_at: '2026-10-08'
- question: Why does Blueprint Joker crash my game?
  summary: Multiple players report crashes after selecting Blueprint Joker on or after
    Blind 3 in v1.0.1o. The crash appears when Blueprint copies an active Joker to
    its left.
  workaround: Save before selecting Blueprint. Avoid picking this joker until next
    patch.
  source_note: Aggregated from 47+ community reports
  updated_at: '2026-10-08'
