- title: Save file corruption on Steam Cloud sync conflict
  version: 1.0.1n
  platform: PC / Steam
  severity: Critical
  reports: 123
  description: "When playing on multiple machines with Steam Cloud enabled, save files can become corrupted during sync conflicts."
  workaround: "Disable Steam Cloud before starting long runs. Back up save files regularly."
