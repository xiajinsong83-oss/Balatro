- rating: 5
  author: Steam Player
  platform: PC / Steam
  hours_played: 120
  title: Best roguelike I've played in years
  content: I went in expecting a casual poker game and came out 3 hours later wondering
    where the time went. The joker combinations are endlessly creative, and every
    run feels different. The scaling math is addictive — there's nothing quite like
    watching your score go from 100 to 100,000 in a single hand.
  source: Steam Review
  date: 2026-09-20
