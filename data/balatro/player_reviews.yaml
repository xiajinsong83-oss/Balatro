  title: Harder than it looks
  content: The tutorial makes it look easy, then the boss Blinds come for you. I got
    destroyed my first 10 runs but that just made me want to try again. Once you figure
    out the joker economy it clicks. Very satisfying when you finally win.
  source: Xbox Community
