  title: Great port, minor bugs
  content: The iOS version runs smoothly and the touch controls are intuitive. It's
    impressive how well the complex UI works on a phone screen. The only issue is
    the occasional crash when your joker board gets crowded. Devs have been patching
    quickly though.
