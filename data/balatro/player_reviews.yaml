- rating: 3
  author: Frustrated Veteran
  platform: PC / Steam
  hours_played: 150
  title: RNG can be brutal
  content: When the shop gives you good jokers it's the best game ever. When it gives
    you garbage for 5 runs straight it feels unfair. The RNG is real — some runs are
    just unwinnable from the first shop. Still love it though.
  source: Reddit r/batardre
